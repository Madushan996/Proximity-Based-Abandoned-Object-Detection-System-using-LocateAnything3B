<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PADS · LocateAnything-3B</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
          --muted:#8b949e; --accent:#58a6ff; --alarm:#ff4d4f; --ok:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--txt); }
  header { padding:14px 20px; border-bottom:1px solid var(--border);
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .tag { font-size:11px; color:var(--muted); border:1px solid var(--border);
                padding:2px 8px; border-radius:999px; }
  .wrap { display:grid; grid-template-columns:1fr 360px; gap:16px; padding:16px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; }
  .stage { padding:12px; display:flex; flex-direction:column; gap:10px; }
  #video { width:100%; background:#000; border-radius:8px; aspect-ratio:16/9;
           object-fit:contain; display:none; }
  .placeholder { width:100%; background:#000; border-radius:8px; aspect-ratio:16/9;
                 display:flex; align-items:center; justify-content:center;
                 color:var(--muted); text-align:center; padding:20px; }
  .controls { display:flex; flex-direction:column; gap:12px; padding:14px; }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px; }
  input, button, textarea { font:inherit; }
  input[type=text], input[type=number], textarea, select {
    width:100%; background:#0d1117; color:var(--txt); border:1px solid var(--border);
    border-radius:6px; padding:8px; }
  button { background:var(--accent); color:#0d1117; border:0; border-radius:6px;
           padding:10px 14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  .status { font-size:12px; color:var(--muted); }
  .bar { height:8px; background:#0d1117; border:1px solid var(--border);
         border-radius:999px; overflow:hidden; display:none; }
  .bar > i { display:block; height:100%; width:0%; background:var(--accent);
             transition:width .2s ease; }
  .log { height:280px; overflow:auto; padding:10px; font:12px ui-monospace,Menlo,monospace; }
  .ev { padding:6px 8px; border-radius:6px; margin-bottom:6px; border:1px solid var(--border); }
  .ev.alarm { border-color:var(--alarm); color:#ffb3b3; background:#2a1416; }
  .stat { display:flex; justify-content:space-between; padding:4px 0;
          border-bottom:1px solid var(--border); }
  .stat b { color:var(--accent); }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em;
       color:var(--muted); margin:0; padding:12px 14px 0; }
</style>
</head>
<body>
<header>
  <h1>PADS — Abandoned Object Detection</h1>
  <span class="tag">NVIDIA LocateAnything-3B</span>
  <span class="tag" id="conn">idle</span>
</header>

<div class="wrap">
  <div class="panel stage">
    <video id="video" controls playsinline></video>
    <div class="placeholder" id="placeholder">Upload a video and press Run.<br/>
      The annotated result will play here when processing finishes.</div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="status" id="frameInfo">No job yet.</div>
  </div>

  <div>
    <div class="panel">
      <div class="controls">
        <div>
          <label>Mode</label>
          <select id="mode">
            <option value="label">Object labeling (overlay)</option>
            <option value="pads">Abandonment detection (PADS)</option>
          </select>
        </div>
        <div>
          <label>Video file</label>
          <input type="file" id="file" accept="video/*" />
        </div>
        <div>
          <label>Object categories (comma-separated, natural language)</label>
          <textarea id="cats" rows="2">backpack, handbag, suitcase, luggage, bag, box, trolley</textarea>
        </div>
        <div class="row">
          <div>
            <label>Abandon timeout (s)</label>
            <input type="number" id="abandon" value="5" min="1" />
          </div>
          <div>
            <label>Detect every N frames</label>
            <input type="number" id="every" value="24" min="1" />
          </div>
        </div>
        <button id="run">Run detection</button>
      </div>
    </div>

    <div class="panel" style="margin-top:16px;">
      <h3>Session stats</h3>
      <div class="controls" style="padding-top:8px;">
        <div class="stat"><span>Frames processed</span><b id="sFrames">0</b></div>
        <div class="stat"><span>Video time</span><b id="sTime">0.0s</b></div>
        <div class="stat"><span>Alarms</span><b id="sAlarms" style="color:var(--alarm)">0</b></div>
      </div>
    </div>

    <div class="panel" style="margin-top:16px;">
      <h3>Event log</h3>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script>
// When served from Modal use same-origin (""); when opened via the local
// launcher (localhost) point at the deployed Modal endpoint.
// ⚠️ REPLACE THIS with the URL printed by `modal deploy modal_app.py`
//    (it looks like: https://<your-username>--pads-locateanything-padsengine-web.modal.run)
const MODAL_URL = "https://YOUR-USERNAME--pads-locateanything-padsengine-web.modal.run";
const API_BASE = location.hostname.endsWith("modal.run") ? "" : MODAL_URL;
function wsUrl(path) {
  const base = API_BASE || location.origin;
  return base.replace(/^http/, "ws") + path;
}

const $ = id => document.getElementById(id);
const log = $("log"), video = $("video"), placeholder = $("placeholder");
const bar = $("bar"), barFill = $("barFill");
let alarms = 0;

function addEvent(e) {
  const div = document.createElement("div");
  if (e.kind === "ALARM") {
    alarms++; $("sAlarms").textContent = alarms;
    div.className = "ev alarm";
    const what = e.label ? `${e.label} (object #${e.object_id})` : `object #${e.object_id}`;
    div.textContent = `🚨 ${e.alarm_id} · ${what} abandoned by person #${e.person_id} @ ${e.t}s`
      + (e.note ? ` (${e.note})` : "");
  } else {
    div.className = "ev";
    div.textContent = JSON.stringify(e);
  }
  log.prepend(div);
}

async function run() {
  const f = $("file").files[0];
  if (!f) { alert("Choose a video file first."); return; }
  $("run").disabled = true;
  log.innerHTML = ""; alarms = 0; $("sAlarms").textContent = "0";
  $("sFrames").textContent = "0"; $("sTime").textContent = "0.0s";
  video.style.display = "none"; video.removeAttribute("src");
  placeholder.style.display = "flex";
  placeholder.textContent = "Uploading…";
  bar.style.display = "block"; barFill.style.width = "0%";
  $("conn").textContent = "uploading…";

  const fd = new FormData();
  fd.append("video", f);
  let job_id;
  try {
    const r = await fetch(API_BASE + "/api/jobs", { method:"POST", body:fd });
    ({ job_id } = await r.json());
  } catch (err) {
    $("conn").textContent = "upload failed";
    placeholder.textContent = "Upload failed: " + err;
    $("run").disabled = false;
    return;
  }

  const ws = new WebSocket(wsUrl(`/ws/jobs/${job_id}`));

  ws.onopen = () => {
    $("conn").textContent = "processing";
    placeholder.textContent = "Processing on GPU… frames are being analysed and rendered.";
    ws.send(JSON.stringify({
      mode: $("mode").value,
      abandon_timeout_s: parseInt($("abandon").value) || 5,
      infer_every_frames: parseInt($("every").value) || 24,
      categories: $("cats").value.split(",").map(s => s.trim()).filter(Boolean),
    }));
  };

  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "progress") {
      $("sFrames").textContent = msg.idx;
      $("sTime").textContent = msg.t.toFixed(1) + "s";
      if (msg.total) {
        const pct = Math.min(100, 100 * msg.idx / msg.total);
        barFill.style.width = pct.toFixed(1) + "%";
        $("frameInfo").textContent = `Processing… ${msg.idx}/${msg.total} frames (${pct.toFixed(0)}%)`;
      } else {
        $("frameInfo").textContent = `Processing… ${msg.idx} frames`;
      }
    } else if (msg.type === "event") {
      addEvent(msg.event);
    } else if (msg.type === "meta") {
      $("frameInfo").textContent = `${msg.source} · ${msg.total_frames} frames @ ${msg.fps.toFixed(0)}fps`;
    } else if (msg.type === "done") {
      $("conn").textContent = "done";
      bar.style.display = "none";
      (msg.events || []).slice().reverse().forEach(addEvent);
      const s = msg.summary || {};
      $("frameInfo").textContent =
        `Complete · ${s.frames ?? "?"} frames · ${s.alarms ?? alarms} alarm(s) · playing annotated result`;
      placeholder.style.display = "none";
      video.src = API_BASE + msg.video_url;
      video.style.display = "block";
      video.load();
      video.play().catch(() => {});  // autoplay may be blocked; controls remain
      $("run").disabled = false;
    } else if (msg.type === "error") {
      $("conn").textContent = "error";
      bar.style.display = "none";
      placeholder.textContent = "Error: " + msg.message;
      addEvent({ kind:"ERROR", message: msg.message });
      $("run").disabled = false;
    }
  };

  ws.onclose = () => { if ($("run").disabled) $("run").disabled = false; };
  ws.onerror = () => { $("conn").textContent = "ws error"; $("run").disabled = false; };
}

$("run").addEventListener("click", run);
</script>
</body>
</html>
